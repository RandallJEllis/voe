[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voe"
version = "0.1.0"
description = "Python vibration-of-effects analysis backed by QR updating and groupwise covariate enumeration"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
progress = ["tqdm>=4.65"]
dev = ["pytest>=7", "pytest-cov", "statsmodels>=0.14", "tqdm>=4.65"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
